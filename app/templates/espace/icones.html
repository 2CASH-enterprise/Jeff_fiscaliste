{# Icônes au trait (pas d'emoji), dessinées en SVG. #}

{%- elif nom == "documents" %}<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>
{%- elif nom == "entreprise" %}<path d="M4 21V5l8-2v18M12 8h8v13"/><path d="M7.5 8h1M7.5 12h1M7.5 16h1M15.5 12h1M15.5 16h1"/>
{%- elif nom == "alerte" %}<path d="M12 3l9 17H3z"/><path d="M12 10v4M12 17h.01"/>
{%- elif nom == "verrou" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>
{%- elif nom == "suivant" %}<path d="M9 6l6 6-6 6"/>
{%- elif nom == "precedent" %}<path d="M15 6l-6 6 6 6"/>
{%- elif nom == "cloche" %}<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>

{%- elif nom == "sortie" %}<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>

</svg>
