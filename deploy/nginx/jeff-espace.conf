# Jeff — coffre fiscal public (lot 17) : https://agenc-ai.com/jeff/espace/
# Copié dans /etc/nginx/snippets/jeff-espace.conf et inclus dans le bloc HTTPS d'agenc-ai.com,
# à côté de jeff-webhook.conf. Le reste de Jeff (/essai, /sante, /docs) reste fermé au public.

# L'adresse nue mène à la connexion (qui renvoie à l'accueil si la session est ouverte).
location = /jeff/espace { return 302 /jeff/espace/connexion; }
location = /jeff/espace/ { return 302 /jeff/espace/connexion; }

location /jeff/espace/ {
    proxy_pass http://127.0.0.1:8020/espace/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Remplacés (jamais complétés) : un visiteur ne peut pas se faire passer pour une autre adresse.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /jeff;
    # Documents : 10 Mo par fichier, plus l'enveloppe du formulaire.
    client_max_body_size 11m;
    proxy_read_timeout 60s;
}

location /jeff/static/ {
    proxy_pass http://127.0.0.1:8020/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 1h;
}
