# Jeff — seule adresse publique : le webhook WhatsApp (lot 9).
# Copié dans /etc/nginx/snippets/jeff-webhook.conf et inclus dans le bloc HTTPS d'agenc-ai.com.
# Tout le reste de Jeff (/essai, /sante…) reste fermé au public (accès par tunnel SSH).
location = /jeff/whatsapp/webhook {
    proxy_pass http://127.0.0.1:8020/whatsapp/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
}
